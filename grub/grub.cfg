set timeout=2
set default=0

insmod all_video

menuentry "Capivara OS" {
    multiboot2 /boot/kernel.elf
    module2 /boot/initrd.tar initrd
    boot
}

menuentry "Capivara OS (modo seguro: sem mouse absoluto)" {
    multiboot2 /boot/kernel.elf novmmouse
    module2 /boot/initrd.tar initrd
    boot
}
