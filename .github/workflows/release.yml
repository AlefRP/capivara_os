# Publica uma versão: ao enviar uma tag vX.Y.Z, compila a ISO, testa o boot
# e cria uma Release no GitHub com a ISO pronta para baixar e gravar num
# pendrive (docs/pendrive.md). A tag precisa bater com kernel/version.h.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Confere a versão
        run: |
          versao=$(sed -n 's/^#define CAPIVARA_VERSION "\(.*\)"/\1/p' kernel/version.h)
          echo "kernel/version.h: $versao | tag: $GITHUB_REF_NAME"
          if [ "v$versao" != "$GITHUB_REF_NAME" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não bate com CAPIVARA_VERSION ($versao) em kernel/version.h"
            exit 1
          fi

      - name: Instala as ferramentas
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            gcc make python3 grub-common grub-pc-bin grub-efi-amd64-bin xorriso mtools \
            qemu-system-x86 ovmf imagemagick

      - name: Compila a ISO
        run: MODO=nativo sh build.sh

      - name: Testa o boot (pendrive UEFI e CD BIOS)
        run: |
          python3 tools/qemu-test.py tests/boot.txt --usb --uefi --out build/test/pendrive-uefi
          python3 tools/qemu-test.py tests/boot.txt --out build/test/cd-bios

      - name: Guarda as capturas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: telas-release
          path: build/test/
          if-no-files-found: ignore

      - name: Publica a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          iso="capivara-os-$GITHUB_REF_NAME.iso"
          cp build/capivara.iso "$iso"
          sha256sum "$iso" > "$iso.sha256"
          cat > notas.md <<EOF
          ISO híbrida do Capivara OS $GITHUB_REF_NAME: serve para máquina virtual e para
          gravar num pendrive (dá boot por BIOS e por UEFI; desligue o Secure Boot).
          Como gravar e o que esperar em hardware real: [docs/pendrive.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/pendrive.md).
          EOF
          gh release create "$GITHUB_REF_NAME" "$iso" "$iso.sha256" \
            --title "Capivara OS $GITHUB_REF_NAME" --notes-file notas.md --generate-notes
